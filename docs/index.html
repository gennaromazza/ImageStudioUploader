<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Studio Uploader</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", sans-serif; background: #f3efe8; color: #1d1a17; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 15% 10%, #ffe7b7, transparent 36%), #f3efe8; }
      main { width: min(720px, calc(100% - 40px)); padding: 36px; border: 1px solid #d7cdc1; border-radius: 22px; background: #fffaf1; box-shadow: 0 18px 40px #0001; }
      h1 { margin-bottom: 8px; } p { color: #6b6259; line-height: 1.55; }
      a.button { display: inline-block; margin-top: 18px; padding: 13px 18px; border-radius: 11px; background: #bd4a28; color: white; text-decoration: none; font-weight: 700; }
      code { color: #1f6f5b; } .meta { margin-top: 22px; padding-top: 18px; border-top: 1px solid #d7cdc1; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <p>IMAGE STUDIO</p>
      <h1>Image Studio Uploader</h1>
      <p>Applicazione Windows per creare gallerie, gestire capitoli e caricare fotografie compatibili con Memoriesospese.</p>
      <a id="download" class="button" href="#">Caricamento ultima versione…</a>
      <div id="meta" class="meta"></div>
    </main>
    <script>
      fetch("./stable.json", { cache: "no-store" }).then(r => r.json()).then(feed => {
        const button = document.getElementById("download");
        button.href = feed.installer.url;
        button.textContent = `Scarica per Windows — v${feed.version}`;
        document.getElementById("meta").innerHTML = `Versione stabile <code>${feed.version}</code> · SHA-256 <code>${feed.installer.sha256}</code>`;
      }).catch(() => { document.getElementById("download").textContent = "Download temporaneamente non disponibile"; });
    </script>
  </body>
</html>
