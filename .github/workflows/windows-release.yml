name: Windows Release

on:
  push:
    tags:
      - "image-studio-uploader-v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:syntax
      - run: npm run build:win
      - name: Verifica versione tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("image-studio-uploader-v$version" -ne "${{ github.ref_name }}") {
            throw "Tag e package.json non coincidono"
          }
      - name: Conserva installer e blockmap del workflow
        uses: actions/upload-artifact@v4
        with:
          name: image-studio-uploader-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error
