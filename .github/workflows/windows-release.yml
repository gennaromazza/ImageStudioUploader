name: Windows Release

on:
  push:
    tags:
      - "image-studio-uploader-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:syntax
      # Un tag induce electron-builder a tentare la pubblicazione implicita.
      # La release viene gestita separatamente e questo job deve solo verificare la build.
      - run: npm run build:win -- --publish never
      - name: Verifica versione tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("image-studio-uploader-v$version" -ne "${{ github.ref_name }}") {
            throw "Tag e package.json non coincidono"
          }
      - name: Conserva installer e blockmap del workflow
        uses: actions/upload-artifact@v4
        with:
          name: image-studio-uploader-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error
      - name: Crea o aggiorna la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Image Studio Uploader ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
